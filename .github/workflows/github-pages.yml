name: Publicar site no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # As Actions vão fixadas pelo hash do commit, não pela versão (achado 13 do
    # pentest de 10/11/26): a versão pode ser apontada pra outro código, o hash
    # não. O comentário diz qual versão é. Quem propõe a troca é o Dependabot
    # (.github/dependabot.yml), uma vez por mês, num pedido só.
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Sincronizar imagens
        run: node prepare-assets.mjs
      # Endereços que já estavam no ar e são usados fora do site: a Play aponta
      # para /privacidade/, /termos/ e /excluir-conta/, e os e-mails do app
      # levavam para /acao/. O .well-known/ guarda o security.txt (contato pra
      # quem achar falha). Ficam na raiz do repositório e entram aqui.
      - name: Juntar as páginas legais e do app
        run: |
          for item in privacidade termos excluir-conta acao .well-known robots.txt CNAME .nojekyll; do
            cp -R "$item" dist/
          done
          mkdir -p dist/assets
          cp assets/style.css dist/assets/style.css
      - name: Verificar arquivos e caminhos
        run: node scripts/check-pages.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # A v4 jogava fora toda pasta que começa com ponto, e o .well-known/
      # sumia. A v5 tem a opção de levar.
      - name: Enviar somente a pasta publicável
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
