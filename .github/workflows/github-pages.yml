name: Publicar site no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sincronizar imagens
        run: node prepare-assets.mjs
      # Endereços que já estavam no ar e são usados fora do site: a Play aponta
      # para /privacidade/, /termos/ e /excluir-conta/, e os e-mails do app
      # levam para /acao/. Ficam na raiz do repositório e entram aqui.
      - name: Juntar as páginas legais e do app
        run: |
          for item in privacidade termos excluir-conta acao emails robots.txt CNAME .nojekyll; do
            cp -R "$item" dist/
          done
          mkdir -p dist/assets
          cp assets/style.css dist/assets/style.css
      - name: Verificar arquivos e caminhos
        run: node scripts/check-pages.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar somente a pasta publicável
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
